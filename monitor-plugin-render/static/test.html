<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Error Handling</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .iframe-container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            border: 1px solid #ddd;
        }
        iframe {
            width: 100%;
            height: 400px;
            border: none;
        }
        .error-message {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="iframe-container">
    <button id="loadIframe">加载 Iframe</button>
    <div id="iframeContainer">
        <iframe id="myIframe" style="display:none;"></iframe> <!-- 直接添加iframe -->
    </div>
    <div id="errorMessage" class="error-message" style="display: none;"></div>
</div>

<script>
    $(document).ready(function () {
        $("#loadIframe").on("click", function () {
            // 获取 iframe 元素
            const iframe = $("#myIframe");
            // 设置 iframe 的 URL
            iframe.attr("src", "https://example.com/invalid-url");  // 设置无效的URL以测试错误捕获

            // 显示 iframe
            iframe.show();

            // 监听 iframe 的加载成功事件
            iframe.on("load", function () {
                $("#errorMessage").hide();  // 隐藏错误信息
            });

            // 捕获 iframe 内的加载错误
            iframe.on("load", function () {
                try {
                    const iframeContent = iframe[0].contentDocument || iframe[0].contentWindow.document;
                    if (iframeContent) {
                        $("#errorMessage").hide();
                    }
                } catch (e) {
                    $("#errorMessage").show().text("无法加载 iframe 内容，可能是跨域或路径错误！");
                }
            });
        });
    });
</script>

</body>
</html>
